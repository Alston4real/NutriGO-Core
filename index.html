
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriGO-Core</title>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>

  <style>
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
      font-family: system-ui, sans-serif;
      background: #f6f8fb;
      color: #18212f;
    }

    main {
      background: white;
      border: 1px solid #dce3ec;
      border-radius: 16px;
      padding: 24px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #1769aa;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      margin: 5px 0;
    }

    button:disabled {
      opacity: 0.5;
    }

    input {
      margin: 15px 0;
    }

    #preview {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #eef3f8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 28px;
      padding-top: 15px;
      border-top: 1px solid #dce3ec;
    }
  </style>
</head>

<body>
  <main>
    <h1>NutriGO-Core</h1>
    <p>AI-powered food recognition and nutrition estimation.</p>

    <div class="section">
      <h2>1. Load AI model</h2>
      <button id="loadButton">Load AI model</button>
      <div id="modelStatus">Model not loaded.</div>
    </div>

    <div class="section">
      <h2>2. Upload food photograph</h2>
      <p>Select a photograph of your meal.</p>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >

      <img id="preview" alt="Selected food photograph">

      <div id="imageStatus">
        No photograph selected.
      </div>
    </div>

  </main>

  <script>
    const MODEL_PATH =
      "./models/food-segmentation/best.onnx";

    let modelSession = null;
    let imageUrl = null;

    const loadButton =
      document.getElementById("loadButton");

    const modelStatus =
      document.getElementById("modelStatus");

    const imageInput =
      document.getElementById("imageInput");

    const preview =
      document.getElementById("preview");

    const imageStatus =
      document.getElementById("imageStatus");

    loadButton.addEventListener("click", async () => {
      loadButton.disabled = true;
      modelStatus.textContent = "Loading model...";

      try {
        if (!window.ort) {
          throw new Error("ONNX Runtime failed to load.");
        }

        ort.env.wasm.numThreads = 1;

        modelSession =
          await ort.InferenceSession.create(
            MODEL_PATH,
            {
              executionProviders: ["wasm"],
              graphOptimizationLevel: "all"
            }
          );

        modelStatus.textContent =
          "SUCCESS: AI model loaded.\n" +
          "Input: " + modelSession.inputNames[0] +
          "\nOutputs: " +
          modelSession.outputNames.join(", ");

      } catch (error) {
        modelStatus.textContent =
          "MODEL LOAD FAILED:\n" + error.message;
      } finally {
        loadButton.disabled = false;
      }
    });

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        imageStatus.textContent =
          "Please select a valid image.";
        return;
      }

      if (imageUrl) {
        URL.revokeObjectURL(imageUrl);
      }

      imageUrl = URL.createObjectURL(file);

      preview.src = imageUrl;
      preview.style.display = "block";

      imageStatus.textContent =
        "Photograph uploaded successfully!\n" +
        "Filename: " + file.name +
        "\nSize: " +
        (file.size / 1024).toFixed(2) + " KB";
    });
  </script>
</body>
</html>
