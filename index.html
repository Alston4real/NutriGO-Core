
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriGO-Core</title>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>

  <style>
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
      font-family: system-ui, sans-serif;
      background: #f6f8fb;
      color: #18212f;
    }

    main {
      background: white;
      border: 1px solid #dce3ec;
      border-radius: 16px;
      padding: 24px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #1769aa;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      margin: 5px 0;
    }

    button:disabled {
      opacity: 0.5;
    }

    input {
      margin: 15px 0;
    }

    #preview {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #eef3f8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 28px;
      padding-top: 15px;
      border-top: 1px solid #dce3ec;
    }
  </style>
</head>

<body>
  <main>
    <h1>NutriGO-Core</h1>
    <p>AI-powered food recognition and nutrition estimation.</p>

    <div class="section">
      <h2>1. Load AI model</h2>
      <button id="loadButton">Load AI model</button>
      <div id="modelStatus">Model not loaded.</div>
    </div>

    <div class="section">
      <h2>2. Upload food photograph</h2>
      <p>Select a photograph of your meal.</p>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >

      <img id="preview" alt="Selected food photograph">

      <div id="imageStatus">
        No photograph selected.
      </div>
      <button id="runButton" disabled>
  Run food recognition
</button>

<div id="inferenceStatus">
  Waiting for a model and photograph.
</div>
    </div>

  </main>

  <script>
    const MODEL_PATH =
      "./models/food-segmentation/best.onnx";
    const CLASS_NAMES = [
  "plate",
  "rice",
  "chicken",
  "cucumber",
  "egg",
  "bean_sprouts",
  "shrimp",
  "sausage",
  "noodles",
  "sauce",
  "pepper",
  "fish",
  "broccoli",
  "lettuce",
  "carrot",
  "tomato",
  "onion",
  "potato",
  "bread",
  "other_ingredients"
];

    let modelSession = null;
    let imageUrl = null;

    const loadButton =
      document.getElementById("loadButton");

    const modelStatus =
      document.getElementById("modelStatus");

    const imageInput =
      document.getElementById("imageInput");

    const preview =
      document.getElementById("preview");

    const imageStatus =
      document.getElementById("imageStatus");
    const runButton =
  document.getElementById("runButton");

const inferenceStatus =
  document.getElementById("inferenceStatus");

    loadButton.addEventListener("click", async () => {
      loadButton.disabled = true;
      modelStatus.textContent = "Loading model...";

      try {
        if (!window.ort) {
          throw new Error("ONNX Runtime failed to load.");
        }

        ort.env.wasm.numThreads = 1;

        modelSession =
          await ort.InferenceSession.create(
            MODEL_PATH,
            {
              executionProviders: ["wasm"],
              graphOptimizationLevel: "all"
            }
          );

runButton.disabled = !imageInput.files.length;

        modelStatus.textContent =
          "SUCCESS: AI model loaded.\n" +
          "Input: " + modelSession.inputNames[0] +
          "\nOutputs: " +
          modelSession.outputNames.join(", ");

      } catch (error) {
        modelStatus.textContent =
          "MODEL LOAD FAILED:\n" + error.message;
      } finally {
        loadButton.disabled = false;
      }
    });

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        imageStatus.textContent =
          "Please select a valid image.";
        return;
      }

      if (imageUrl) {
        URL.revokeObjectURL(imageUrl);
      }

      imageUrl = URL.createObjectURL(file);

      preview.src = imageUrl;
      preview.style.display = "block";

      imageStatus.textContent =
        "Photograph uploaded successfully!\n" +
        "Filename: " + file.name +
        "\nSize: " +
        (file.size / 1024).toFixed(2) + " KB";
      runButton.disabled = !modelSession;
    });
    
async function runFoodInference() {
  if (!modelSession) {
    inferenceStatus.textContent = "Please load the AI model first.";
    return;
  }

  const file = imageInput.files[0];

  if (!file) {
    inferenceStatus.textContent = "Please select a photograph first.";
    return;
  }

  runButton.disabled = true;
  inferenceStatus.textContent = "Preparing photograph...";

  try {
    const image = new Image();

    image.src = imageUrl;

    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = reject;
    });

    const canvas = document.createElement("canvas");
    canvas.width = 640;
    canvas.height = 640;

    const ctx = canvas.getContext("2d");

    // Preserve the photograph's proportions.
    ctx.fillStyle = "rgb(114, 114, 114)";
    ctx.fillRect(0, 0, 640, 640);

    const scale = Math.min(
      640 / image.width,
      640 / image.height
    );

    const width = Math.round(image.width * scale);
    const height = Math.round(image.height * scale);

    const left = Math.round((640 - width) / 2);
    const top = Math.round((640 - height) / 2);

    ctx.drawImage(image, left, top, width, height);

    // Convert RGB pixels into the model's NCHW format.
    const pixels = ctx.getImageData(0, 0, 640, 640).data;

    const inputData = new Float32Array(3 * 640 * 640);

    for (let i = 0; i < 640 * 640; i++) {
      inputData[i] = pixels[i * 4] / 255;
      inputData[640 * 640 + i] = pixels[i * 4 + 1] / 255;
      inputData[2 * 640 * 640 + i] = pixels[i * 4 + 2] / 255;
    }

    const inputTensor = new ort.Tensor(
      "float32",
      inputData,
      [1, 3, 640, 640]
    );

    inferenceStatus.textContent = "Running AI model...";

    const outputs = await modelSession.run({
      [modelSession.inputNames[0]]: inputTensor
    });

    
const predictionTensor = outputs[modelSession.outputNames[0]];
const predictionData = predictionTensor.data;

const numberOfCandidates = 8400;
const numberOfClasses = CLASS_NAMES.length;

const candidates = [];

for (let i = 0; i < numberOfCandidates; i++) {
  let bestClass = -1;
  let bestConfidence = 0;

  for (let c = 0; c < numberOfClasses; c++) {
    const confidence =
      predictionData[(4 + c) * numberOfCandidates + i];

    if (confidence > bestConfidence) {
      bestConfidence = confidence;
      bestClass = c;
    }
  }

  if (bestConfidence >= 0.25) {
    candidates.push({
      className: CLASS_NAMES[bestClass],
      confidence: bestConfidence,
      x: predictionData[i],
      y: predictionData[numberOfCandidates + i],
      width: predictionData[2 * numberOfCandidates + i],
      height: predictionData[3 * numberOfCandidates + i]
    });
  }
}


function calculateIoU(a, b) {
  const ax1 = a.x - a.width / 2;
  const ay1 = a.y - a.height / 2;
  const ax2 = a.x + a.width / 2;
  const ay2 = a.y + a.height / 2;

  const bx1 = b.x - b.width / 2;
  const by1 = b.y - b.height / 2;
  const bx2 = b.x + b.width / 2;
  const by2 = b.y + b.height / 2;

  const intersectionWidth = Math.max(
    0, Math.min(ax2, bx2) - Math.max(ax1, bx1)
  );

  const intersectionHeight = Math.max(
    0, Math.min(ay2, by2) - Math.max(ay1, by1)
  );

  const intersection =
    intersectionWidth * intersectionHeight;

  const areaA = a.width * a.height;
  const areaB = b.width * b.height;

  const union = areaA + areaB - intersection;

  return union > 0 ? intersection / union : 0;
}

candidates.sort((a, b) => b.confidence - a.confidence);

const selectedPredictions = [];

while (candidates.length > 0) {
  const best = candidates.shift();

  selectedPredictions.push(best);

  for (let i = candidates.length - 1; i >= 0; i--) {
    if (
      candidates[i].className === best.className &&
      calculateIoU(best, candidates[i]) > 0.45
    ) {
      candidates.splice(i, 1);
    }
  }
}

const topPredictions = selectedPredictions.slice(0, 10);

const predictionReport = topPredictions.length
  ? topPredictions.map((item, index) =>
      `${index + 1}. ${item.className} — ${(item.confidence * 100).toFixed(1)}%`
    ).join("\n")
  : "No predictions above 25% confidence.";

inferenceStatus.textContent =
  "RAW FOOD PREDICTIONS\n\n" +
  predictionReport +
  "\n\nCandidates above threshold: " + candidates.length;


   
  } catch (error) {
    inferenceStatus.textContent =
      "INFERENCE FAILED:\n" + error.message;

    console.error(error);

  } finally {
    runButton.disabled = false;
  }
}

runButton.addEventListener("click", runFoodInference);

  </script>
</body>
</html>
