
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriGO-Core | Model test</title>
  <style>
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
      font-family: system-ui, sans-serif;
      background: #f6f8fb;
      color: #18212f;
    }
    main {
      background: white;
      border: 1px solid #dce3ec;
      border-radius: 16px;
      padding: 24px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #1769aa;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #eef3f8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
</head>
<body>
  <main>
    <h1>NutriGO-Core</h1>
    <p>Milestone 1: Load the food-recognition model in your browser.</p>

    <button id="loadButton">Load AI model</button>
    <div id="status">Waiting to load the model.</div>
  </main>

  <script>
    const MODEL_PATH = "./models/food-segmentation/best.onnx";
    const button = document.getElementById("loadButton");
    const statusBox = document.getElementById("status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      statusBox.textContent = "Loading model…";

      try {
        if (!window.ort) {
          throw new Error("ONNX Runtime did not load. Check your internet connection.");
        }

        ort.env.wasm.numThreads = 1;

        const session = await ort.InferenceSession.create(MODEL_PATH, {
          executionProviders: ["wasm"],
          graphOptimizationLevel: "all"
        });

        statusBox.textContent =
          "SUCCESS: model loaded in your browser.\n\n" +
          "Input: " + session.inputNames[0] + "\n" +
          "Outputs: " + session.outputNames.join(", ") +
          "\n\nNext: run the model on a food photograph.";
      } catch (error) {
        statusBox.textContent =
          "MODEL LOAD FAILED\n\n" + (error.message || String(error));
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
